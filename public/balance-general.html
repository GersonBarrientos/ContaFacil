<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance General - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .sangria-1 { padding-left: 2rem !important; }
        .fila-totales { background-color: #f8f9fa !important; font-weight: bold; }
        .grupo-header { background-color: #2c3e50; color: white; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <div id="appNavbar"></div>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <h2 class="text-center mb-4">Balance General</h2>
                
                <!-- Panel de Filtros -->
                <div class="card shadow-sm border-0 mb-4 bg-white">
                    <div class="card-body">
                        <form id="form-filtros" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label for="select-libro" class="form-label fw-bold">Libro Diario</label>
                                <select id="select-libro" class="form-select" required>
                                    <option value="">Seleccione un libro...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="fecha-inicio" class="form-label fw-bold">Desde</label>
                                <input type="date" id="fecha-inicio" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label for="fecha-fin" class="form-label fw-bold">Hasta</label>
                                <input type="date" id="fecha-fin" class="form-control" required>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-search"></i> Generar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Tabla del Balance -->
                <div class="card shadow border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover mb-0" id="tabla-balance">
                                <thead class="table-dark text-center">
                                    <tr>
                                        <th>Concepto</th>
                                        <th>Monto ($)</th>
                                        <th>Total ($)</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpo-balance">
                                    <tr><td colspan="3" class="text-center text-muted py-4">Seleccione un libro y un rango de fechas para generar el reporte.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script src="/js/balance-general.js"></script>
</body>
</html>
