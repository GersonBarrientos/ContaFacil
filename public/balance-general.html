<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance General - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .sangria-1 { padding-left: 2rem !important; }
        .fila-totales { background-color: #f1f5f9 !important; font-weight: 600; color: #334155; }
        
        .card-premium {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            background: #fff;
        }

        /* Mejoras en la Tabla (Minimalista) */
        .table-responsive {
            border-radius: 8px;
            overflow: auto;
        }
        .table {
            border-collapse: separate;
            border-spacing: 0;
            --bs-table-bg: transparent;
        }
        .table thead th {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            z-index: 1;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            border-top: none;
            padding: 1rem;
        }
        .table tbody td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            vertical-align: middle;
        }
        .table tbody tr:hover td { background-color: #f8fafc; }
        
        .grupo-header td { 
            background-color: #f8fafc !important; 
            color: #0f172a !important; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            border-bottom: 2px solid #e2e8f0;
            padding-top: 1.5rem !important;
        }

        .subgrupo-header td {
            font-weight: 600;
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding-top: 1.25rem !important;
            border-bottom: 1px dashed #e2e8f0;
        }
            background-color: #10b981 !important;
            color: white !important;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .table-success-premium td { border-color: #059669; }
        
        .table-danger-premium {
            background-color: #ef4444 !important;
            color: white !important;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .table-danger-premium td { border-color: #dc2626; }

        /* Estado Vacío */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            color: #64748b;
        }
        .empty-state i {
            font-size: 4.5rem;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        /* KPI Widget */
        .kpi-card {
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .kpi-success { background-color: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
        .kpi-danger { background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .kpi-icon { font-size: 1.25rem; line-height: 1; }
        .kpi-value { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 0; }

        @media print {
            .no-print { display: none !important; }
            #printHeader { display: block !important; }
            body { background-color: #fff; padding: 0; }
            .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .card { border: none !important; box-shadow: none !important; }
            .table { border-collapse: collapse !important; width: 100% !important; }
            .table th, .table td { border: 1px solid #000 !important; padding: 4px !important; font-size: 10pt; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div id="appNavbar" class="no-print"></div>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-4 no-print">
                    <h2 class="mb-0 fw-bold"><i class="bi bi-bank text-primary me-2"></i> Balance General</h2>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-success rounded-pill px-4 shadow-sm" onclick="exportarExcel()" title="Exportar a Excel"><i class="bi bi-file-earmark-excel me-1"></i> Excel</button>
                        <button class="btn btn-outline-danger rounded-pill px-4 shadow-sm" onclick="window.print()" title="Imprimir / PDF"><i class="bi bi-printer me-1"></i> PDF</button>
                    </div>
                </div>

                <div id="printHeader" class="text-center d-none mb-4">
                    <h3 id="printEmpresa" class="mb-1"></h3>
                    <h5 id="printLibro" class="text-muted mb-1">Balance General</h5>
                    <p id="printFecha" class="mb-0 text-muted"></p>
                </div>
                
                <!-- Panel de Filtros -->
                <div class="card card-premium mb-4 no-print">
                    <div class="card-body">
                        <form id="form-filtros" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label for="select-libro" class="form-label fw-semibold">Libro Diario</label>
                                <select id="select-libro" class="form-select shadow-sm" required>
                                    <option value="">Seleccione un libro...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="fecha-inicio" class="form-label fw-semibold">Desde</label>
                                <input type="date" id="fecha-inicio" class="form-control shadow-sm" required>
                            </div>
                            <div class="col-md-3">
                                <label for="fecha-fin" class="form-label fw-semibold">Hasta</label>
                                <input type="date" id="fecha-fin" class="form-control shadow-sm" required>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" id="btn-generar" class="btn btn-primary w-100 shadow-sm rounded-3">
                                    <i class="bi bi-search me-1"></i> Generar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Estado Vacío -->
                <div id="emptyState" class="card card-premium empty-state no-print mb-4">
                    <i class="bi bi-building"></i>
                    <h4 class="fw-semibold text-dark">Ningún reporte generado</h4>
                    <p class="text-muted mb-0">Selecciona un libro contable y el rango de fechas para visualizar el balance general.</p>
                </div>

                <!-- Tabla del Balance -->
                <div id="reporteArea" style="display: none;">
                    
                    <!-- KPI Area: Estado del Cuadre -->
                    <div id="kpiArea" class="mb-4 no-print" style="display: none;">
                        <div class="kpi-card shadow-sm" id="kpiCard">
                            <div class="kpi-icon" id="kpiIcon"><i class="bi bi-shield-check"></i></div>
                            <div>
                                <div class="text-uppercase fw-bold opacity-75" style="font-size: 0.7rem;" id="kpiTitle">Balance Cuadrado</div>
                                <p class="kpi-value" id="kpiValue">Total Activo = Pasivo + Patrimonio</p>
                            </div>
                        </div>
                    </div>

                    <div class="card card-premium mb-5">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" id="tabla-balance">
                                <thead>
                                    <tr>
                                        <th>Concepto</th>
                                        <th class="text-end">Monto ($)</th>
                                        <th class="text-end">Total ($)</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpo-balance">
                                    <!-- Filas dinámicas -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar.js?v=4"></script>
    <script src="/js/balance-general.js"></script>
</body>
</html>
