<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Blob decorations in the background */
        .blob-1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background-color: #f59e0b; /* Orange blob */
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(40px);
            z-index: 0;
        }
        .blob-2 {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background-color: #0d9488; /* Teal blob */
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(50px);
            z-index: 0;
        }

        .login-wrapper {
            display: flex;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* Left section (Form) */
        .login-left {
            flex: 1;
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-left h1 {
            font-weight: 800;
            font-size: 2.5rem;
            color: #111827;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }
        .login-left p.subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Right section (Image) */
        .login-right {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-image-container {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background-color: #ffffff; /* match image background ideally */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-image-container img {
            width: 100%;
            height: 100%;
            max-height: 550px;
            object-fit: contain; /* Para que la imagen cuadrada 1:1 no se recorte */
            border-radius: 20px;
        }

        /* Form styles */
        .form-control {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #0d9488;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }
        .input-group-text {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-right: none;
            color: #6b7280;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }
        .form-control.with-icon {
            border-left: none;
            padding-left: 0;
        }

        .btn-primary-custom {
            background-color: #111827;
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-primary-custom:hover {
            background-color: #1f2937;
            transform: translateY(-1px);
        }

        .btn-success-custom {
            background-color: #0d9488;
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-success-custom:hover {
            background-color: #0f766e;
            transform: translateY(-1px);
        }

        /* Tabs styling */
        .nav-pills {
            background-color: #f3f4f6;
            border-radius: 12px;
            padding: 0.3rem;
            margin-bottom: 2rem;
        }
        .nav-pills .nav-link {
            border-radius: 8px;
            color: #4b5563;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            transition: all 0.2s;
        }
        .nav-pills .nav-link.active {
            background-color: #ffffff;
            color: #111827;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        .divider:not(:empty)::before {
            margin-right: .5em;
        }
        .divider:not(:empty)::after {
            margin-left: .5em;
        }

    </style>
</head>
<body>

    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="login-wrapper">
        <!-- Left Side: Forms -->
        <div class="login-left">
            <div class="d-flex align-items-center gap-2 mb-3">
                <img src="img/LOGOTIPO.png" alt="Logo" style="height: 35px;" onerror="this.style.display='none'">
            </div>
            
            <h1>Bienvenido</h1>
            <p class="subtitle">Nos alegra verte de nuevo por aquí</p>

            <div id="loginAlert" class="alert alert-danger d-none small p-2 text-center rounded-3"></div>
            <div id="registerAlert" class="alert alert-success d-none small p-2 text-center rounded-3"></div>

            <ul class="nav nav-pills nav-justified" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Iniciar Sesión</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Crear Empresa</button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <!-- Pestaña Login -->
                <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="email" class="form-control with-icon" id="email" placeholder="Correo electrónico" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control with-icon" id="password" placeholder="Contraseña" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary-custom" id="btnSubmit">
                            INGRESAR
                        </button>
                    </form>
                </div>
                
                <!-- Pestaña Registro -->
                <div class="tab-pane fade" id="pills-register" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-building"></i></span>
                                <input type="text" class="form-control with-icon" id="reg_nombre_legal" placeholder="Nombre de tu empresa" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control with-icon" id="reg_email" placeholder="Correo electrónico admin" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" class="form-control with-icon" id="reg_password" placeholder="Contraseña de acceso" required minlength="4">
                            </div>
                        </div>
                        <button type="submit" class="btn-success-custom" id="btnRegisterSubmit">
                            CREAR Y EMPEZAR
                        </button>
                    </form>
                </div>
        </div>

        <!-- Right Side: Image -->
        <div class="login-right">
            <div class="login-image-container shadow-sm">
                <!-- Se intentará cargar login.png, luego login.jpg, o un fallback de color -->
                <img src="img/login.png" alt="Bienvenido" id="loginHeroImage" 
                     onerror="this.onerror=null; this.src='img/login.jpg'; this.onerror=function(){ this.style.display='none'; this.parentNode.style.background='linear-gradient(135deg, #0d9488 0%, #0f766e 100%)'; };">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/login.js?v=4"></script>
</body>
</html>
<!-- v2 -->
