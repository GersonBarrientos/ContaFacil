<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Resultados - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .sangria-1 { padding-left: 2rem !important; }
        .fila-totales { background-color: #d1e7dd !important; font-weight: bold; }
        .input-inventario { width: 100px; text-align: right; padding: 2px 5px; }
        @media print {
            .no-print { display: none !important; }
            #printHeader { display: block !important; }
            body { background-color: #fff; padding: 0; }
            .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .card { border: none !important; box-shadow: none !important; }
            .table { border-collapse: collapse !important; width: 100% !important; }
            .table th, .table td { border: 1px solid #000 !important; padding: 4px !important; font-size: 10pt; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-light">
    <!-- Inyector del Menú -->
    <div id="appNavbar" class="no-print"></div>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-4 no-print">
                    <h2 class="mb-0">Estado de Resultados</h2>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-success" onclick="exportarExcel()" title="Exportar a Excel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
                        <button class="btn btn-outline-danger" onclick="window.print()" title="Imprimir / PDF"><i class="bi bi-printer"></i> PDF</button>
                    </div>
                </div>
                
                <div id="printHeader" class="text-center d-none mb-4">
                    <h3 id="printEmpresa" class="mb-1"></h3>
                    <h5 id="printLibro" class="text-muted mb-1">Estado de Resultados</h5>
                    <p id="printFecha" class="mb-0 text-muted"></p>
                </div>
                
                <!-- Panel de Filtros -->
                        <div class="card shadow-sm border-0 mb-4 bg-white no-print">
                            <div class="card-body">
                                <form id="form-filtros" class="row g-3 align-items-end">
                                    <div class="col-md-4">
                                        <label for="select-libro" class="form-label fw-bold">Libro Diario</label>
                                        <select id="select-libro" class="form-select" required>
                                            <option value="">Seleccione un libro...</option>
                                            <!-- Las opciones se cargarán desde la base de datos -->
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="fecha-inicio" class="form-label fw-bold">Desde</label>
                                        <input type="date" id="fecha-inicio" class="form-control" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="fecha-fin" class="form-label fw-bold">Hasta</label>
                                        <input type="date" id="fecha-fin" class="form-control" required>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="bi bi-search"></i> Generar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                <div class="card shadow border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover mb-0">
                                <thead class="table-dark text-center">
                                    <tr>
                                        <th>Concepto</th>
                                        <th>Parcial</th>
                                        <th>Subtotal</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-resultados">
                                    <tr><td colspan="4" class="text-center text-muted py-4">Cargando reporte analítico...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/estado-resultados.js"></script>
</body>
</html>
