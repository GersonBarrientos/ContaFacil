<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance de Comprobación - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .tabular-nums { font-variant-numeric: tabular-nums; }
        @media print {
            .no-print { display: none !important; }
            body { font-size: 12pt; background-color: #fff; color: #000; }
            .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .card { border: none !important; box-shadow: none !important; }
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #dee2e6 !important; padding: 0.25rem !important; }
        }
    </style>
</head>
<body class="bg-light">
    <div id="appNavbar" class="no-print"></div>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4 no-print">
            <h2 class="mb-0"><i class="bi bi-clipboard-check text-primary me-2"></i> Balance de Comprobación</h2>
            <button class="btn btn-outline-secondary" onclick="window.print()">
                <i class="bi bi-printer me-2"></i> Imprimir
            </button>
        </div>

        <div class="card shadow-sm mb-4 no-print">
            <div class="card-body">
                <form id="filtroForm" class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Libro Contable</label>
                        <select id="selectLibro" class="form-select" required>
                            <option value="">Cargando libros...</option>
                        </select>
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label">Fecha de corte (Hasta)</label>
                        <input type="date" id="inputFechaFin" class="form-control" required>
                    </div>
                    
                    <div class="col-md-3">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="checkRango">
                            <label class="form-check-label" for="checkRango">Solo movimientos del período</label>
                        </div>
                        <input type="date" id="inputFechaInicio" class="form-control" disabled>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Formato</label>
                        <div class="d-flex align-items-center gap-3 mb-2">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="formato" id="formatoSaldos" value="saldos" checked>
                                <label class="form-check-label" for="formatoSaldos">Solo saldos</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="formato" id="formatoSumas" value="sumas">
                                <label class="form-check-label" for="formatoSumas">Sumas y saldos</label>
                            </div>
                        </div>
                        <button type="submit" id="btnGenerar" class="btn btn-primary w-100">
                            <i class="bi bi-gear me-2"></i> Generar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="mensajeArea" class="no-print"></div>

        <div id="reporteArea" style="display: none;">
            <div class="text-center mb-4">
                <h3 id="printEmpresa" class="mb-1"></h3>
                <h5 id="printLibro" class="text-muted mb-1"></h5>
                <p id="printFecha" class="mb-0 text-muted"></p>
                <p class="mb-0 text-muted small">Expresado en Dólares de los Estados Unidos de América</p>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light align-middle text-center">
                        <tr>
                            <th rowspan="2">Código</th>
                            <th rowspan="2">Cuenta</th>
                            <th colspan="2" class="col-sumas">Sumas</th>
                            <th colspan="2">Saldos</th>
                        </tr>
                        <tr>
                            <th class="col-sumas">Debe</th>
                            <th class="col-sumas">Haber</th>
                            <th>Deudor</th>
                            <th>Acreedor</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo">
                        <!-- Filas dinámicas -->
                    </tbody>
                    <tfoot class="table-group-divider" id="tablaPie">
                        <!-- Fila de totales -->
                    </tfoot>
                </table>
            </div>
            
            <div id="alertaCuadre" class="alert mt-3 no-print" role="alert" style="display:none;"></div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/balance-comprobacion.js"></script>
</body>
</html>
