<div class="container-fluid px-5 mt-4 mb-5">
    <!-- Encabezado -->
    <div class="row mb-4 align-items-center">
        <div class="col-md-4">
            <a href="index.html" class="btn btn-outline-secondary btn-sm shadow-sm">
                <i class="bi bi-arrow-left"></i> Volver al Menú
            </a>
        </div>
        <div class="col-md-4 text-center">
            <h2 class="fw-bold text-primary mb-0">Libro Diario</h2>
        </div>
        <div class="col-md-4 text-end">
            <span class="badge bg-secondary fs-6 shadow-sm">Nuevo Asiento</span>
        </div>
    </div>

    <!-- Panel de Ingreso de Datos (Tarjeta Mejorada) -->
    <div class="card shadow-sm mb-4 border-0 bg-light">
        <div class="card-body">
            <h6 class="card-title text-muted mb-3 fw-bold"><i class="bi bi-pencil-square"></i> Detalle del movimiento</h6>
            
            <!-- Fila 1: Clasificación de Cuentas -->
            <div class="row g-3 align-items-end mb-3">
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Fecha</label>
                    <input type="date" id="inputFecha" class="form-control form-control-sm shadow-sm">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Libro</label>
                    <select id="selectLibro" class="form-select form-select-sm shadow-sm"></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">1. Cuenta Principal</label>
                    <select id="selectPrincipal" class="form-select form-select-sm shadow-sm" onchange="alCambiarPrincipal()">
                        <option value="">Cargando catálogo...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">2. Subcuenta</label>
                    <select id="selectSubcuenta" class="form-select form-select-sm shadow-sm" onchange="alCambiarSubcuenta()" disabled>
                        <option value="">-- Seleccione primero una cuenta principal --</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Código (Subcuenta)</label>
                    <input type="text" id="inputCodigo" class="form-control form-control-sm bg-white shadow-sm" readonly placeholder="Auto">
                </div>
            </div>
            
            <!-- Fila 2: Montos y Acción -->
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <!-- Checkbox oculto necesario para tu lógica JS -->
                    <input class="form-check-input d-none" type="checkbox" id="checkSubcuenta">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-primary">Debe ($)</label>
                    <input type="number" id="inputDebe" class="form-control form-control-sm border-primary shadow-sm" step="0.01" min="0" value="0.00">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-success">Haber ($)</label>
                    <input type="number" id="inputHaber" class="form-control form-control-sm border-success shadow-sm" step="0.01" min="0" value="0.00">
                </div>
                <div class="col-md-2">
                    <button onclick="agregarLinea()" class="btn btn-primary btn-sm w-100 shadow-sm fw-bold">
                        <i class="bi bi-plus-lg"></i> Agregar Línea
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla Dinámica del Asiento -->
    <div class="table-responsive shadow-sm rounded border-0 mb-4">
        <table class="table table-hover table-bordered table-ledger align-middle mb-0" id="tablaAsiento">
            <thead class="table-dark">
                <tr>
                    <th width="10%">Fecha</th>
                    <th width="45%">Concepto / Asiento</th>
                    <th width="15%">Parcial ($)</th>
                    <th width="15%">Debe ($)</th>
                    <th width="15%">Haber ($)</th>
                    <th width="5%" class="text-center">Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla" class="bg-white">
             
            </tbody>
            <tfoot>
                <tr class="table-light fw-bold">
                    <td colspan="3" class="text-end text-muted">TOTALES:</td>
                    <td class="monto text-primary fs-6" id="totalDebe">0.00</td>
                    <td class="monto text-primary fs-6" id="totalHaber">0.00</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- Sección de Guardado Final -->
    <div class="card shadow-sm border-0 bg-light">
        <div class="card-body p-3">
            <div class="row align-items-center g-3">
                <div class="col-md-8">
                    <div class="input-group input-group-sm shadow-sm">
                        <span class="input-group-text bg-white fw-bold text-muted">Concepto general:</span>
                        <input type="text" id="inputDescripcion" class="form-control" placeholder="Ej. Venta del día al contado...">
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <button onclick="guardarAsientoBD()" class="btn btn-success btn-sm w-100 fw-bold shadow-sm">
                        <i class="bi bi-save"></i> Guardar Asiento Completo
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
