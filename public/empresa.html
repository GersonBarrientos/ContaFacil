<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de empresa - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="appNavbar"></div>
    <main class="container py-4">
        <h1 class="h3 my-3">Configuración de empresa</h1>
        <div id="mensaje"></div>
        <form id="empresaForm" class="row g-3 bg-white p-4 shadow-sm">
            <div class="col-md-6"><label class="form-label">Nombre legal *</label><input name="nombre_legal" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Nombre comercial</label><input name="nombre_comercial" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">NIT</label><input name="nit" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">NRC</label><input name="nrc" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Giro comercial</label><input name="giro_comercial" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">País</label><input name="pais" class="form-control"></div>
            <div class="col-12"><label class="form-label">Dirección</label><textarea name="direccion" class="form-control"></textarea></div>
            <div class="col-md-4"><label class="form-label">Teléfono</label><input name="telefono" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Email</label><input name="email" type="email" class="form-control"></div>
            <div class="col-md-2"><label class="form-label">Moneda</label><input name="moneda" class="form-control"></div>
            <div class="col-md-2"><label class="form-label">Logo (URL)</label><input name="logo" class="form-control"></div>
            <div class="col-12"><button class="btn btn-primary">Guardar configuración</button></div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/empresa.js"></script>
</body>
</html>
