<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayorización - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="appNavbar"></div>
    <main class="container py-4">
        <h1 class="h3 mb-4">Mayorización</h1>
        <section class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form id="filtroMayorizacion" class="row g-3 align-items-end">
                    <div class="col-md-4"><label class="form-label fw-bold">Libro</label><select id="libro" class="form-select"><option value="">Todos los libros</option></select></div>
                    <div class="col-md-3"><label class="form-label fw-bold">Desde</label><input id="fechaInicio" type="date" class="form-control" required></div>
                    <div class="col-md-3"><label class="form-label fw-bold">Hasta</label><input id="fechaFin" type="date" class="form-control" required></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100">Consultar</button></div>
                </form>
            </div>
        </section>
        <div id="mensaje"></div>
        <div class="table-responsive bg-white shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark"><tr><th>Cuenta</th><th>Nombre</th><th class="text-end">Debe</th><th class="text-end">Haber</th><th class="text-end">Saldo</th></tr></thead>
                <tbody id="resultados"><tr><td colspan="5" class="text-center text-muted py-4">Consulta un período para ver la mayorización.</td></tr></tbody>
            </table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mayorizacion.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
