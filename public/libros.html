<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros diarios - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="appNavbar"></div>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div><h1 class="h3 mt-2">Libros diarios</h1></div>
            <button class="btn btn-primary" id="nuevoLibro">+ Nuevo libro</button>
        </div>
        <div id="empresaActual" class="text-muted mb-3"></div>
        <div id="mensaje"></div>
        <div class="table-responsive bg-white shadow-sm">
            <table class="table align-middle mb-0">
                <thead><tr><th>Código</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Asientos</th><th>Acciones</th></tr></thead>
                <tbody id="libros"></tbody>
            </table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/libros.js"></script>
</body>
</html>
