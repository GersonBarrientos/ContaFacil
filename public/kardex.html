<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarjeta Kardex - ContaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #zonaImpresion, #zonaImpresion * { visibility: visible; }
            #zonaImpresion { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
        .tarjeta-menu:hover { opacity: 0.9; transform: scale(1.01); transition: 0.2s; }
    </style>
</head>
<body class="bg-light">
    <div id="appNavbar" class="no-print"></div>

    <div class="container mt-4">
        <!-- Formulario de Registro -->
        <div class="card shadow-sm mb-4 no-print">
            <div class="card-header bg-dark text-white"><h4>Registrar Movimiento en Kardex</h4></div>
            <div class="card-body">
                <form id="formularioKardex">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label>Fecha *</label>
                            <input type="date" class="form-control" id="fecha_movimiento" required>
                        </div>
                        <div class="col-md-3">
                            <label>Tipo de Movimiento *</label>
                            <select class="form-select border-primary" id="tipo_movimiento" required>
                                <option value="" selected disabled>Seleccione...</option>
                                <option value="INVENTARIO_INICIAL">Inventario Inicial (Entrada)</option>
                                <option value="COMPRA">Compra (Entrada)</option>
                                <option value="VENTA">Venta (Salida)</option>
                                <option value="DEV_COMPRA">Dev. sobre Compra (Salida)</option>
                                <option value="DEV_VENTA">Dev. sobre Venta (Entrada)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Cuenta (Auto) *</label>
                            <input type="text" class="form-control bg-light fw-bold text-primary" id="cuenta_contable" readonly placeholder="Se asigna sola">
                        </div>
                        <div class="col-md-3">
                            <label>Artículo / Producto *</label>
                            <input type="text" class="form-control" id="articulo" placeholder="Ej. Laptops" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label>Concepto Manual *</label>
                            <input type="text" class="form-control" id="concepto" placeholder="Ej. Factura 001" required>
                        </div>
                        <div class="col-md-3">
                            <label>Cantidad *</label>
                            <input type="number" class="form-control" id="cantidad" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <label>Precio Unitario *</label>
                            <input type="number" step="0.01" class="form-control" id="precio_ingresado" required>
                        </div>
                        <div class="col-md-2" id="contenedor_iva">
                            <label>IVA *</label>
                            <select class="form-select" id="condicion_iva">
                                <option value="mas_iva">Neto</option>
                                <option value="incluido">Incluido</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary float-end"><i class="bi bi-save"></i> Guardar</button>
                </form>
            </div>
        </div>

        <!-- Menú de Bloques (Global / Individual) -->
        <div class="row mb-3 no-print">
            <div class="col-md-6">
                <div class="card bg-primary text-white text-center shadow tarjeta-menu" style="cursor: pointer;" id="btnVerGlobal">
                    <div class="card-body py-4">
                        <h2 class="mb-0"><i class="bi bi-globe"></i> GLOBAL</h2>
                        <span>Ver todos los artículos mezclados cronológicamente</span>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-success text-white text-center shadow tarjeta-menu" style="cursor: pointer;" id="btnVerIndividual">
                    <div class="card-body py-4">
                        <h2 class="mb-0"><i class="bi bi-box-seam"></i> INDIVIDUAL</h2>
                        <span>Buscar y ver el Kardex de un solo artículo</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Buscador Individual (Oculto por defecto) -->
        <div class="card shadow-sm mb-3 no-print" id="cajaBuscador" style="display: none;">
            <div class="card-body bg-light d-flex gap-2">
                <select id="input_buscar" class="form-select form-select-lg border-success">
                    <option value="" selected disabled>Cargando artículos...</option>
                </select>
                <button class="btn btn-success btn-lg px-4" id="btnBuscarActual"><i class="bi bi-search"></i> Cargar</button>
            </div>
        </div>

        <!-- Tabla de Historial -->
        <div class="card shadow-sm" id="zonaImpresion">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0" id="tituloHistorial">Historial del Kardex</h5>
                <div class="d-flex gap-2 no-print">
                    <button class="btn btn-light btn-sm" onclick="exportarExcel()"><i class="bi bi-file-earmark-excel text-success"></i> Excel</button>
                    <button class="btn btn-light btn-sm" onclick="window.print()"><i class="bi bi-file-pdf text-danger"></i> PDF</button>
                </div>
            </div>
            <div class="card-body overflow-auto">
                <table class="table table-bordered text-center align-middle" id="tablaKardex">
                    <thead class="table-dark">
                        <tr>
                            <th rowspan="2">Fecha</th>
                            <th rowspan="2">Artículo</th>
                            <th rowspan="2">Concepto</th>
                            <th colspan="3">Entradas</th>
                            <th colspan="3">Salidas</th>
                            <th colspan="3">Existencias</th>
                            <th rowspan="2" class="no-print">Acción</th>
                        </tr>
                        <tr>
                            <th>Cant</th><th>C.Unit</th><th>Total</th>
                            <th>Cant</th><th>C.Unit</th><th>Total</th>
                            <th>Cant</th><th>C.Unit</th><th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaKardex"></tbody>
                    <tfoot id="pieTablaKardex" class="bg-light fw-bold"></tfoot>
                </table>
            </div>
        </div>
    </div>
    
    <script src="/js/navbar.js"></script>
    <script src="/js/kardex.js"></script>
</body>
</html>
